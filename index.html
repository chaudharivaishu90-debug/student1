             <form class="form" id="form">
                       <div class="card new-card">
                        <div class="card-header d-flex fa-2x justify-content-between">
                           <h3>Add Your Pet</h3>
                           <img src="https://cdn-icons-png.flaticon.com/128/15721/15721630.png" class="pet" alt="">
                        </div>
                        <div class="card-body form-group">
                             <label for="name">Name:-</label>
                             <input type="text" class="form-control" id="name">

                             <label for="Photo">Photo:-</label>
                        <input type="url" class="form-control" id="Photo">                          
                        
                             <label for="name">Type:-</label>
                             <select name="" id="Type" class="form-control">
                                <option value="" selected disabled>Select</option>
                                <option value="Cat">Cat</option>
                                <option value="Dog">Dog</option>
                            </select>
                             <label for="name">Breed:-</label>
                              <select name="" id="Breed" class="form-control">

                                <option value="Labrador">Labrador Retriever</option>
                                <option value="Siamese ">Siamese </option>
                            </select>
                             
                        <div class="card-footer d-flex justify-content-between">

                            <button type="button" class="btn btn-sm btn-warning d-none" id="updaButton">Update</button>
                            <button type="button" class="btn btn-sm btn-dark" id="closeBtn">Close</button>
